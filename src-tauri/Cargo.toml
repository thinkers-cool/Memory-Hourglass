[package]
name = "memhg"
version = "0.1.0"
description = "Local-first photo library"
authors = ["you"]
edition = "2021"

[lib]
name = "memhg_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "memhg"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
exiftool-rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
walkdir = "2"
rayon = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
sha2 = "0.10"
keyring = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs", "test-util"] }
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage)',
    'cfg(coverage_nightly)',
] }
